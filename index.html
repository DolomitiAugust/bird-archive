<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f6f3ea">
  <meta name="description" content="浏览真实的鸟类摄影，按中文名、英文名、学名或分类检索世界鸟类档案。">
  <title>鸟类档案馆</title>
  <link rel="icon" type="image/png" href="assets/seal.png">
  <link rel="stylesheet" href="assets/site.css?v=2">
  <script type="module" src="assets/app.js?v=2"></script>
</head>
<body>
  <a class="skip-link" href="#content">跳到主要内容</a>
  <header class="masthead">
    <div class="shell head-inner">
      <a class="brand" href="#gallery" data-nav><span class="seal" aria-hidden="true"><span>羽</span></span><span>鸟类档案馆</span></a>
      <nav class="primary-nav" aria-label="馆内导航">
        <a href="#gallery" data-nav data-section="gallery">影像总览</a>
        <a href="#checklist" data-nav data-section="checklist">全球名录</a>
      </nav>
    </div>
  </header>
  <main id="content" class="shell" tabindex="-1">
    <section id="browse" aria-labelledby="browse-title">
      <div class="catalog-head">
        <div class="heading-group"><h1 id="browse-title">馆藏影像</h1><span id="total" class="total"></span></div>
        <form id="search-form" role="search">
          <label for="query" class="sr-only">检索鸟种</label>
          <span class="search-icon" aria-hidden="true"></span>
          <input id="query" type="search" placeholder="搜索鸟名、别名或学名" autocomplete="off">
        </form>
      </div>
      <div class="collection-info" id="collection-info"></div>
      <div class="index-row">
        <span class="index-label" id="index-label">按目浏览</span>
        <div id="paper-tabs" class="paper-tabs" role="group" aria-labelledby="index-label"></div>
        <div class="select-group" id="taxonomy" hidden>
          <label><span>目</span><select id="order" aria-label="按目筛选"></select></label>
          <label><span>科</span><select id="family" aria-label="按科筛选"></select></label>
        </div>
        <button class="text-button reset" id="reset" type="button" hidden>清除筛选</button>
      </div>
      <p id="status" class="sr-only" aria-live="polite"></p>
      <div id="results" aria-label="物种列表"></div>
      <nav id="pager" class="pager" aria-label="结果分页" hidden>
        <button id="previous" class="line-button" type="button">上一页</button>
        <span id="page-number"></span>
        <button id="next" class="line-button" type="button">下一页</button>
      </nav>
    </section>
    <section id="record" aria-labelledby="record-title" hidden></section>
    <noscript><p>请启用 JavaScript，以浏览图库、检索名录或打开物种档案。</p></noscript>
  </main>
  <footer class="shell footer"><span>鸟类档案馆</span><button id="sources-button" class="text-button" type="button">资料与授权</button></footer>
  <dialog id="sources-dialog" aria-labelledby="sources-title">
    <div class="dialog-head"><h2 id="sources-title">资料与授权</h2><button id="close-sources" class="line-button" type="button" autofocus>关闭</button></div>
    <div id="sources-content"></div>
  </dialog>
</body>
</html>
