<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#141d1a" data-dark="#141d1a" data-light="#f1eee5">
  <script src="assets/appearance.js?v=4"></script>
  <meta name="description" data-en-content="Explore bird photography and search the world checklist by Chinese, English or scientific name and taxonomy." content="浏览真实的鸟类摄影，按中文名、英文名、学名或分类检索世界鸟类档案。">
  <title>鸟类档案馆</title>
  <link rel="icon" type="image/svg+xml" href="assets/emblem.svg">
  <link rel="preload" href="assets/fonts/archive-song.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/site.css?v=4">
  <link rel="stylesheet" href="assets/record.css?v=4">
  <link rel="stylesheet" href="assets/type.css?v=4">
  <script type="module" src="assets/app.js?v=4.1"></script>
</head>
<body>
  <a class="skip-link" data-en="Skip to main content" href="#content">跳到主要内容</a>
  <header class="masthead">
    <div class="shell head-inner">
      <a class="brand" href="#gallery" data-nav><img src="assets/emblem.svg" alt="" width="38" height="38"><span data-en="Bird Archive">鸟类档案馆</span></a>
      <nav class="primary-nav" aria-label="馆内导航" data-en-aria="Main navigation">
        <a href="#gallery" data-nav data-section="gallery" data-en="Photo gallery">影像总览</a>
        <a href="#checklist" data-nav data-section="checklist" data-en="World checklist">全球名录</a>
      </nav>
      <div class="language-picker" role="group" aria-label="界面语言" data-en-aria="Interface language">
        <button type="button" id="lang-zh" data-lang="zh" lang="zh-CN" aria-pressed="true">中文</button>
        <span aria-hidden="true">/</span>
        <button type="button" id="lang-en" data-lang="en" lang="en" aria-pressed="false">English</button>
      </div>
      <button type="button" id="theme-toggle" aria-label="深色模式" aria-pressed="true"><span class="theme-sun" aria-hidden="true">☼</span><span class="theme-moon" aria-hidden="true">☾</span></button>
    </div>
  </header>
  <main id="content" tabindex="-1">
    <section id="archive-cover" aria-labelledby="cover-title">
      <div class="cover-inner shell">
        <div class="cover-copy">
          <div class="cover-edition"><span>AviList</span><span>v2026</span></div>
          <h1 id="cover-title" data-en="The World Bird Archive">世界鸟类图录</h1>
          <p class="cover-intro" data-en="Explore the world's birds through photographs and species records.">从一张实拍照片，查阅一个物种的档案。</p>
          <dl class="cover-stats">
            <div><dt data-en="Species">收录物种</dt><dd id="cover-species">11,172</dd></div>
            <div><dt data-en="Orders">目</dt><dd id="cover-orders">45</dd></div>
            <div><dt data-en="Families">科</dt><dd id="cover-families">250</dd></div>
          </dl>
        </div>
        <div class="cover-display">
          <a class="cover-plate" id="link-cover-bullfinch" href="#bird/BH-0005" data-nav data-opener="cover-bullfinch">
            <span class="cover-print"><img src="photos/bullfinch.webp" fetchpriority="high" alt="" width="900" height="643"></span>
            <span class="cover-slip"><span><strong data-en="Eurasian Bullfinch">红腹灰雀</strong><i lang="la">Pyrrhula pyrrhula</i></span><span class="accession">BH-0005</span></span>
          </a>
          <span class="cover-credit"><a href="https://commons.wikimedia.org/wiki/File:Bullfinch_male.jpg">© Francis C. Franklin</a> · <a href="https://creativecommons.org/licenses/by-sa/3.0/">CC BY-SA 3.0</a></span>
        </div>
      </div>
    </section>
    <section id="browse" class="catalog-layout shell" aria-labelledby="browse-title">
      <aside class="archive-sidebar"><details id="cabinet-controls" open>
        <summary><span class="drawer-symbol" aria-hidden="true"></span><span data-en="Collection index">馆藏目录</span></summary>
        <div class="cabinet-body">
          <div class="collection-info" id="collection-info"></div>
          <div class="index-row">
            <span class="index-label" id="index-label">按目浏览</span>
            <div id="paper-tabs" class="paper-tabs" role="group" aria-labelledby="index-label"></div>
            <div class="select-group" id="taxonomy" hidden>
              <label><span data-en="Order">目</span><select id="order" aria-label="按目筛选" data-en-aria="Filter by order"></select></label>
              <label><span data-en="Family">科</span><select id="family" aria-label="按科筛选" data-en-aria="Filter by family"></select></label>
              <label id="photo-filter" hidden><span data-en="Photos">影像</span><select id="media" aria-label="按照片收录情况筛选" data-en-aria="Filter by photo coverage"><option value="" data-en="All records">全部档案</option><option value="with" data-en="With photos">已有实拍</option><option value="missing" data-en="Awaiting photos">照片待补</option></select></label>
            </div>
            <button class="text-button reset" id="reset" data-en="Clear filters" type="button" hidden>清除筛选</button>
          </div>
        </div>
      </details></aside>
      <div class="catalog-results">
      <div class="catalog-head">
        <div class="heading-group"><h1 id="browse-title">馆藏影像</h1><span id="total" class="total"></span></div>
        <form id="search-form" role="search">
          <label for="query" data-en="Find a bird" class="sr-only">检索鸟种</label>
          <span class="search-icon" aria-hidden="true"></span>
          <input id="query" type="search" data-en-placeholder="Search bird names or scientific names" placeholder="搜索鸟名、别名或学名" autocomplete="off">
        </form>
      </div>
      <p id="status" class="sr-only" aria-live="polite"></p>
      <div id="results" data-en-aria="Species list" aria-label="物种列表"></div>
      <nav id="pager" class="pager" aria-label="结果分页" data-en-aria="Results pagination" hidden>
        <button id="previous" data-en="Previous" class="line-button" type="button">上一页</button>
        <span id="page-number"></span>
        <button id="next" data-en="Next" class="line-button" type="button">下一页</button>
      </nav>
      </div>
    </section>
    <section id="record" class="shell" aria-labelledby="record-title" hidden></section>
    <noscript><p>请启用 JavaScript，以浏览图库、检索名录或打开物种档案。</p><p lang="en">Enable JavaScript to browse photographs, search the checklist and open species records.</p></noscript>
  </main>
  <footer class="shell footer"><span data-en="Bird Archive">鸟类档案馆</span><button id="sources-button" data-en="Sources and licenses" class="text-button" type="button">资料与授权</button></footer>
  <dialog id="sources-dialog" aria-labelledby="sources-title">
    <div class="dialog-head"><h2 id="sources-title" data-en="Sources and licenses">资料与授权</h2><button id="close-sources" data-en="Close" class="line-button" type="button" autofocus>关闭</button></div>
    <div id="sources-content"></div>
  </dialog>
</body>
</html>
